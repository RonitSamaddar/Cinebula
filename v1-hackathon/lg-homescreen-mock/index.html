<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LG webOS — Home Screen</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <style>
    /* ═══════════════════════════════════════════
       RESET & BASE
    ═══════════════════════════════════════════ */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #121212;
      --bg-card: #1e1e1e;
      --bg-sidebar: rgba(30, 30, 30, 0.92);
      --text: #ffffff;
      --text-soft: #b0b0b0;
      --text-dim: #666;
      --accent-green: #4caf50;
      --accent-purple: #7e57c2;
      --accent-magenta: #c2185b;
      --accent-blue: #42a5f5;
      --accent-olive: #9e9d24;
      --focus-ring: rgba(255, 255, 255, 0.7);
      --glass: rgba(50, 50, 50, 0.85);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --radius-pill: 100px;
      --sidebar-w: 60px;
      --transition: 0.2s ease;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: 'LG Smart UI', -apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    /* ═══════════════════════════════════════════
       TV FRAME (16:9 centered)
    ═══════════════════════════════════════════ */
    .tv-frame {
      width: 100vw; height: 100vh;
      display: flex;
      background: var(--bg);
      position: relative;
      overflow: hidden;
    }

    /* ═══════════════════════════════════════════
       LEFT SIDEBAR
    ═══════════════════════════════════════════ */
    .sidebar {
      width: var(--sidebar-w);
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 0 24px;
      gap: 6px;
      z-index: 20;
      position: relative;
      background: transparent;
      flex-shrink: 0;
    }

    .sidebar-profile-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 8px;
      gap: 4px;
    }

    .sidebar-profile {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, #e91e63, #f48fb1);
      cursor: pointer;
      transition: var(--transition);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700;
      flex-shrink: 0;
    }

    .device-id-label {
      font-size: 7px;
      color: var(--text-dim);
      letter-spacing: 0.3px;
      text-align: center;
      line-height: 1.2;
      max-width: 56px;
      word-break: break-all;
    }

    .sidebar-icon {
      width: 40px; height: 40px;
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: all var(--transition);
      color: var(--text-soft);
      position: relative;
    }
    .sidebar-icon:hover, .sidebar-icon.focused {
      background: rgba(255,255,255,0.12);
      color: var(--text);
    }
    .sidebar-icon.focused {
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
    }
    .sidebar-icon svg {
      width: 22px; height: 22px;
      fill: currentColor;
    }

    /* ═══════════════════════════════════════════
       MAIN CONTENT AREA
    ═══════════════════════════════════════════ */
    .main {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* ═══════════════════════════════════════════
       HERO BANNER
    ═══════════════════════════════════════════ */
    .hero {
      width: 100%;
      height: 46%;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
      cursor: pointer;
    }
    .hero-bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      transition: opacity 0.8s ease, transform 0.8s ease;
    }
    .hero-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, var(--bg) 0%, transparent 50%),
                  linear-gradient(to right, rgba(0,0,0,0.6) 0%, transparent 60%);
    }
    .hero-content {
      position: absolute;
      bottom: 28px; left: 32px; right: 32px;
      z-index: 2;
    }
    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 4px 12px;
      border-radius: var(--radius-pill);
      font-size: 11px;
      font-weight: 600;
      color: var(--text-soft);
      margin-bottom: 10px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .hero-badge-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #4caf50;
    }
    .hero-title {
      font-size: clamp(32px, 4vw, 56px);
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 6px;
      text-shadow: 0 2px 20px rgba(0,0,0,0.6);
    }
    .hero-subtitle {
      font-size: 14px;
      color: var(--text-soft);
      margin-bottom: 14px;
      max-width: 400px;
      line-height: 1.4;
    }
    .hero-actions {
      display: flex;
      gap: 10px;
    }
    .hero-btn {
      padding: 10px 24px;
      border-radius: var(--radius-pill);
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
      letter-spacing: 0.3px;
    }
    .hero-btn-primary {
      background: #fff;
      color: #111;
    }
    .hero-btn-secondary {
      background: rgba(255,255,255,0.18);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .hero-btn:hover, .hero-btn.focused {
      transform: scale(1.05);
      box-shadow: 0 4px 20px rgba(255,255,255,0.15);
    }

    /* Hero dots */
    .hero-dots {
      position: absolute;
      bottom: 12px;
      right: 32px;
      display: flex;
      gap: 6px;
      z-index: 3;
    }
    .hero-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.3);
      transition: var(--transition);
      cursor: pointer;
    }
    .hero-dot.active {
      background: #fff;
      width: 20px;
      border-radius: 4px;
    }

    /* ═══════════════════════════════════════════
       CATEGORY BUTTONS ROW
    ═══════════════════════════════════════════ */
    .categories {
      display: flex;
      gap: 8px;
      padding: 12px 16px 8px;
      flex-shrink: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .categories::-webkit-scrollbar { display: none; }

    .cat-btn {
      flex-shrink: 0;
      padding: 10px 22px;
      border-radius: var(--radius-sm);
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition);
      color: #fff;
      letter-spacing: 0.3px;
      white-space: nowrap;
    }
    .cat-btn:hover, .cat-btn.focused {
      transform: scale(1.06);
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
    }

    /* ═══════════════════════════════════════════
       APP LAUNCHER ROW
    ═══════════════════════════════════════════ */
    .app-row {
      display: flex;
      gap: 8px;
      padding: 6px 16px 8px;
      flex-shrink: 0;
      overflow-x: auto;
      scrollbar-width: none;
      align-items: center;
    }
    .app-row::-webkit-scrollbar { display: none; }

    .app-icon {
      width: 56px; height: 56px;
      border-radius: var(--radius-md);
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: all var(--transition);
      position: relative;
      overflow: hidden;
      background: var(--bg-card);
      border: 1px solid rgba(255,255,255,0.08);
    }
    .app-icon:hover, .app-icon.focused {
      transform: scale(1.15);
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
      z-index: 2;
    }
    .app-icon img {
      width: 100%; height: 100%;
      object-fit: contain;
      border-radius: var(--radius-md);
    }
    .app-icon .app-text {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-align: center;
      line-height: 1.1;
      padding: 2px;
    }

    /* ═══════════════════════════════════════════
       CONTENT ROWS
    ═══════════════════════════════════════════ */
    .content-section {
      flex: 1;
      min-height: 0;
      padding: 4px 0 0;
    }
    .content-section-title {
      font-size: 14px;
      font-weight: 600;
      padding: 0 16px 8px;
      color: var(--text-soft);
    }
    .content-row {
      display: flex;
      gap: 10px;
      padding: 0 16px 12px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .content-row::-webkit-scrollbar { display: none; }

    .content-card {
      flex-shrink: 0;
      width: 180px;
      height: 110px;
      border-radius: var(--radius-md);
      overflow: hidden;
      cursor: pointer;
      transition: all var(--transition);
      position: relative;
      background: var(--bg-card);
    }
    .content-card:hover, .content-card.focused {
      transform: scale(1.08);
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
      z-index: 2;
    }
    .content-card-bg {
      width: 100%; height: 100%;
      object-fit: cover;
    }
    .content-card-label {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 20px 8px 6px;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 100%);
      font-size: 11px;
      font-weight: 600;
      color: #fff;
    }
    .content-card-badge {
      position: absolute;
      top: 6px; left: 6px;
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      font-size: 9px;
      font-weight: 600;
      color: #fff;
      letter-spacing: 0.3px;
    }

    /* Input card (HDMI) */
    .input-card {
      flex-shrink: 0;
      width: 140px;
      height: 110px;
      border-radius: var(--radius-md);
      overflow: hidden;
      cursor: pointer;
      transition: all var(--transition);
      background: linear-gradient(135deg, #2a2a3e, #1e1e2e);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .input-card:hover, .input-card.focused {
      transform: scale(1.08);
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
    }
    .input-card-label {
      font-size: 10px;
      color: var(--text-soft);
      letter-spacing: 0.3px;
    }
    .input-card-title {
      font-size: 11px;
      font-weight: 600;
    }
    .input-card svg {
      width: 32px; height: 32px;
      fill: var(--text-soft);
    }

    /* ═══════════════════════════════════════════
       BOTTOM INDICATOR
    ═══════════════════════════════════════════ */
    .bottom-indicator {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
    }
    .bottom-indicator svg {
      width: 28px; height: 28px;
      fill: rgba(255,255,255,0.3);
      animation: bob 2s ease-in-out infinite;
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(4px); }
    }

    /* ═══════════════════════════════════════════
       CINEBULA CARD (special)
    ═══════════════════════════════════════════ */
    .cinebula-card {
      position: relative;
      overflow: visible;
    }
    .cinebula-card::after {
      content: 'NEW';
      position: absolute;
      top: -4px; right: -4px;
      background: linear-gradient(135deg, #7c4dff, #e040fb);
      color: #fff;
      font-size: 7px;
      font-weight: 800;
      padding: 2px 5px;
      border-radius: 4px;
      letter-spacing: 0.5px;
      z-index: 3;
    }

    /* ═══════════════════════════════════════════
       TIME DISPLAY (top-right)
    ═══════════════════════════════════════════ */
    .top-bar-right {
      position: absolute;
      top: 16px; right: 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      z-index: 10;
    }
    .top-bar-right .time {
      font-size: 13px;
      font-weight: 500;
      color: rgba(255,255,255,0.7);
      letter-spacing: 0.5px;
    }
    .top-bar-icon {
      width: 28px; height: 28px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      color: rgba(255,255,255,0.5);
      transition: var(--transition);
      border-radius: 50%;
    }
    .top-bar-icon:hover, .top-bar-icon.focused {
      color: #fff;
      background: rgba(255,255,255,0.1);
    }
    .top-bar-icon svg {
      width: 18px; height: 18px;
      fill: currentColor;
    }



    /* ═══════════════════════════════════════════
       ANIMATIONS
    ═══════════════════════════════════════════ */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes shimmer {
      0% { background-position: -200px 0; }
      100% { background-position: 200px 0; }
    }

    /* ═══════════════════════════════════════════
       NOTIFICATION BADGE
    ═══════════════════════════════════════════ */
    .notif-badge {
      position: absolute;
      top: 2px; right: 2px;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #f44336;
      border: 1.5px solid var(--bg);
    }

    /* ═══════════════════════════════════════════
       WIFI & CONNECTIVITY ICONS
    ═══════════════════════════════════════════ */
    .status-icons {
      position: absolute;
      top: 16px; right: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 10;
    }

    /* ═══════════════════════════════════════════
       CONNECT CINEBULA SIDEBAR BUTTON
    ═══════════════════════════════════════════ */
    .sidebar-cinebula-btn {
      width: 42px; height: 42px;
      border-radius: var(--radius-sm);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: all var(--transition);
      position: relative;
      background: linear-gradient(135deg, rgba(181,108,255,0.15), rgba(124,77,255,0.15));
      border: 1px solid rgba(181,108,255,0.3);
      color: #b56cff;
    }
    .sidebar-cinebula-btn:hover, .sidebar-cinebula-btn.focused {
      background: linear-gradient(135deg, rgba(181,108,255,0.3), rgba(124,77,255,0.3));
      border-color: rgba(181,108,255,0.6);
      box-shadow: 0 0 16px rgba(181,108,255,0.3);
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
    }
    .sidebar-cinebula-btn svg {
      width: 22px; height: 22px;
      fill: currentColor;
    }
    .sidebar-cinebula-label {
      font-size: 6px;
      color: #b56cff;
      text-align: center;
      letter-spacing: 0.3px;
      margin-top: 2px;
      line-height: 1.1;
      max-width: 56px;
    }

    /* ═══════════════════════════════════════════
       QR CODE MODAL
    ═══════════════════════════════════════════ */
    .qr-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .qr-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }
    .qr-modal {
      background: #1a1a2e;
      border: 1px solid rgba(181,108,255,0.3);
      border-radius: var(--radius-xl);
      padding: 36px 40px;
      text-align: center;
      max-width: 380px;
      width: 90%;
      box-shadow: 0 24px 80px rgba(0,0,0,0.6), 0 0 40px rgba(181,108,255,0.1);
      transform: scale(0.9);
      transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
    }
    .qr-overlay.visible .qr-modal {
      transform: scale(1);
    }
    .qr-modal-logo {
      font-size: 28px;
      margin-bottom: 4px;
    }
    .qr-modal-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 4px;
      background: linear-gradient(135deg, #b56cff, #7c4dff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .qr-modal-subtitle {
      font-size: 12px;
      color: var(--text-soft);
      margin-bottom: 24px;
      line-height: 1.4;
    }
    .qr-canvas-wrap {
      background: #fff;
      border-radius: var(--radius-md);
      padding: 16px;
      display: inline-block;
      margin-bottom: 20px;
    }
    .qr-canvas-wrap canvas {
      display: block;
    }
    .qr-id-display {
      font-size: 16px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      color: #b56cff;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }
    .qr-device-info {
      font-size: 10px;
      color: var(--text-dim);
      margin-bottom: 20px;
    }
    .qr-close-btn {
      padding: 10px 28px;
      border-radius: var(--radius-pill);
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08);
      color: var(--text-soft);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }
    .qr-close-btn:hover {
      background: rgba(255,255,255,0.15);
      color: #fff;
    }

    /* ═══════════════════════════════════════════
       CINEBULA QUEUE ROW (shown when shows queued)
    ═══════════════════════════════════════════ */
    .cinebula-queue-section {
      flex-shrink: 0;
      padding: 4px 0 0;
      display: none;
    }
    .cinebula-queue-section.visible {
      display: block;
    }
    .cinebula-queue-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 16px 6px;
    }
    .cinebula-queue-header-icon {
      font-size: 14px;
    }
    .cinebula-queue-header-title {
      font-size: 13px;
      font-weight: 600;
      background: linear-gradient(90deg, #b56cff, #7c4dff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .cinebula-queue-header-count {
      font-size: 10px;
      color: var(--text-dim);
      margin-left: 4px;
    }
    .cinebula-queue-row {
      display: flex;
      gap: 10px;
      padding: 0 16px 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .cinebula-queue-row::-webkit-scrollbar { display: none; }

    .queue-card {
      flex-shrink: 0;
      width: 150px;
      height: 95px;
      border-radius: var(--radius-md);
      overflow: hidden;
      cursor: pointer;
      transition: all var(--transition);
      position: relative;
      border: 1px solid rgba(181,108,255,0.25);
    }
    .queue-card:hover, .queue-card.focused {
      transform: scale(1.08);
      box-shadow: 0 4px 20px rgba(181,108,255,0.25);
      outline: 2px solid var(--focus-ring);
      outline-offset: 2px;
      z-index: 2;
    }
    .queue-card:hover .queue-card-bg, .queue-card.focused .queue-card-bg {
      filter: brightness(0.45);
    }
    .queue-card-bg {
      width: 100%; height: 100%;
      transition: filter 0.25s ease;
    }
    .queue-card-bottom {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 18px 8px 5px;
      background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, transparent 100%);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .queue-card-label {
      font-size: 10px;
      font-weight: 600;
      color: #fff;
    }
    .queue-card-desc {
      font-size: 8px;
      line-height: 1.3;
      color: rgba(255,255,255,0.75);
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transition: max-height 0.25s ease, opacity 0.25s ease;
    }
    .queue-card:hover .queue-card-desc, .queue-card.focused .queue-card-desc {
      max-height: 40px;
      opacity: 1;
    }
    .queue-card-match {
      position: absolute;
      top: 5px; right: 5px;
      background: rgba(181,108,255,0.8);
      padding: 1px 6px;
      border-radius: var(--radius-pill);
      font-size: 8px;
      font-weight: 700;
      color: #fff;
    }

    /* ═══════════════════════════════════════════
       SHOW DETAIL MODAL
    ═══════════════════════════════════════════ */
    .show-detail-overlay {
      position: fixed;
      inset: 0;

// QR CODE GENERATOR — Uses qrcode-generator library
// Produces real, scannable QR codes
// ═══════════════════════════════════════════
function generateQR(canvas, text, size) {
  const qr = qrcode(0, 'L'); // Auto-detect version, Error correction Level L
  qr.addData(text);
  qr.make();

  const ctx = canvas.getContext('2d');
  canvas.width = size;
  canvas.height = size;

  const moduleCount = qr.getModuleCount();
  const quiet = 2;
  const totalModules = moduleCount + quiet * 2;
  const cellSize = size / totalModules;

  // White background
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, size, size);

  // Draw modules
  ctx.fillStyle = '#000000';
  for (let r = 0; r < moduleCount; r++) {
    for (let c = 0; c < moduleCount; c++) {
      if (qr.isDark(r, c)) {
        ctx.fillRect(
          Math.floor((c + quiet) * cellSize),
          Math.floor((r + quiet) * cellSize),
          Math.ceil(cellSize),
          Math.ceil(cellSize)
        );
      }
    }
  }
}

function updateClock() {
  const now = new Date();
  const h = now.getHours();
  const m = now.getMinutes().toString().padStart(2, '0');
  const ampm = h >= 12 ? 'PM' : 'AM';
  const h12 = h % 12 || 12;
  document.getElementById('clock').textContent = `${h12}:${m} ${ampm}`;
}

// SHOW DETAIL MODAL

const showDetailOverlay = document.getElementById('showDetailOverlay');

function openShowDetail(item) {
  document.getElementById('showDetailHero').style.background = item.gradient;
  document.getElementById('showDetailTitle').textContent = item.title;
  document.getElementById('showDetailMeta').innerHTML = `
    <span class="show-detail-match">${item.match}% Match</span>
    <span class="show-detail-meta-tag">${item.genre}</span>
    <span class="show-detail-meta-tag">${item.subgenre}</span>

    <span>${item.year}</span>
  `;
  document.getElementById('showDetailDesc').textContent = item.desc;
  document.getElementById('showDetailInfo').innerHTML = `
    <div class="show-detail-info-item"><b>Seasons:</b> ${item.seasons}</div>
    <div class="show-detail-info-item"><b>Episodes:</b> ${item.episodes}</div>
    <div class="show-detail-info-item"><b>Runtime:</b> ${item.runtime}</div>
    <div class="show-detail-info-item"><b>Creator:</b> ${item.creator}</div>
  `;
  showDetailOverlay.classList.add('visible');
}

function closeShowDetail() {
  showDetailOverlay.classList.remove('visible');
}

document.getElementById('showDetailClose').addEventListener('click', closeShowDetail);
document.getElementById('showDetailPlay').addEventListener('click', closeShowDetail);
showDetailOverlay.addEventListener('click', (e) => {
  if (e.target === showDetailOverlay) closeShowDetail();
});

// ═══════════════════════════════════════════
// KEYBOARD NAVIGATION (simulate TV remote)
// ═══════════════════════════════════════════
function getNavRows() {
  const rows = ['sidebar', 'hero', 'categories', 'apps'];
  if (CINEBULA_QUEUE.length > 0) rows.push('cinebula-queue');
  rows.push('picks');
  return rows;
}

let focusRow = 1; // hero
let focusCol = 0;
let currentFocused = null;

function getItemsInRow(rowName) {
  if (rowName === 'sidebar') return [...document.querySelectorAll('[data-nav="sidebar"]')];
  if (rowName === 'hero') return [document.getElementById('hero')];
  if (rowName === 'categories') return [...document.querySelectorAll('[data-nav="categories"]')];
  if (rowName === 'apps') return [...document.querySelectorAll('[data-nav="apps"]')];
  if (rowName === 'cinebula-queue') return [...document.querySelectorAll('[data-nav="cinebula-queue"]')];
  if (rowName === 'picks') return [...document.querySelectorAll('[data-nav="picks"]')];
  return [];
}

function setFocus(row, col) {
  const NAV_ROWS = getNavRows();
  // Remove previous focus
  if (currentFocused) currentFocused.classList.remove('focused');

  focusRow = Math.max(0, Math.min(NAV_ROWS.length - 1, row));
  const rowName = NAV_ROWS[focusRow];
  const items = getItemsInRow(rowName);
  if (items.length === 0) return;

  focusCol = Math.max(0, Math.min(items.length - 1, col));
  currentFocused = items[focusCol];
  currentFocused.classList.add('focused');

  // Scroll into view
  currentFocused.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
}

document.addEventListener('keydown', (e) => {
  switch (e.key) {
    case 'ArrowUp':
      e.preventDefault();
      setFocus(focusRow - 1, focusCol);
      break;
    case 'ArrowDown':
      e.preventDefault();
      setFocus(focusRow + 1, focusCol);
      break;
    case 'ArrowLeft':
      e.preventDefault();
      setFocus(focusRow, focusCol - 1);
      break;
    case 'ArrowRight':
      e.preventDefault();
      setFocus(focusRow, focusCol + 1);
      break;
    case 'Enter':
    case ' ':
      e.preventDefault();
      if (currentFocused) {
        currentFocused.click();
        // Flash effect
        currentFocused.style.transform = 'scale(0.95)';
        setTimeout(() => { if (currentFocused) currentFocused.style.transform = ''; }, 150);
      }
      break;
    case 'Backspace':
    case 'Escape':
      e.preventDefault();
      if (showDetailOverlay.classList.contains('visible')) {
        closeShowDetail();
      } else if (qrOverlay.classList.contains('visible')) {
        hideQRModal();
      }
      break;
  }
});

// Click-to-focus for mouse users
document.querySelectorAll('[data-nav]').forEach(el => {
  el.addEventListener('click', () => {
    const rowName = el.getAttribute('data-nav');
    const rowIdx = getNavRows().indexOf(rowName);
    const colIdx = parseInt(el.getAttribute('data-col') || '0');
    if (rowIdx >= 0) setFocus(rowIdx, colIdx);
  });
});

// Initial focus on hero
setTimeout(() => setFocus(1, 0), 100);
